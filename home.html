<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link  rel="icon" type="image/png" href="image/dklogo.png">
    <link rel="stylesheet" type="text/css" href="home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="home.js" defer></script>
</head>
<body>
    <div id="all">
        <h1 id="heading">HOME</h1>
    <center>
        <div class="dialogue-box" id="dialogue">Loading...</div>
        <a href="game.html"><button id="start">START</button></a>
        <div id="box">
        <a href="aboutus.html"><button class="btno" id="ab">About us</button></a>
        <a href="more.html"><button class="btno" id="mo">More</button></a>
        <a href="https://wa.me/919080008298"><button class="btno" id="wh">Whats app</button></a>
        <a href="contact.html"><button class="btno" id="contact">Contact</button></a>
        </div>
    </center>
    </div>
  <script>
    // Example: Fetching dialogues from a local JSON file
    fetch('dialogues.json')
      .then(response => response.json())
      .then(data => {
        // Pick a random dialogue
        const randomIndex = Math.floor(Math.random() * data.length);
        document.getElementById('dialogue').innerText = data[randomIndex];
      })
      .catch(error => {
        document.getElementById('dialogue').innerText = "Error loading dialogue.";
        console.error(error);
      });
  </script>
</body>
</html>
